<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>ТОВАРЫ И ТОЧКА</title>
    <link
      rel="icon"
      href="/assets/favicon/favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="/css/index.css"
    />
  </head>
  <body>
    <main class="wrapper">
      <div id="header"></div>
      <section class="main-section">
        <div class="container">
          <h2>Корзина</h2>
          <input
            type="checkbox"
            id="myCheckbox"
          />
          <label class="myCheckbox" for="myCheckbox">Выбрать все</label>
          <div class="divider"></div>
          <div id="products-container">
            <div id="carts"></div>
          </div>
          <div id="delivery"></div>
          <div id="payment"></div>
          <div id="recipient"></div>
        </div>
        <div id="aside"></div>
      </section>
    </main>

    <footer>
      <img
        src="/assets/img/footer.svg"
        alt=""
      />
    </footer>

    <script src="/constants/Catalog/catalog.js"></script>
    <script src="/constants/root.js"></script>
    <script src="/utils/localStorageUtil.js"></script>

    <script src="/components/Header/Header.js"></script>
    <link
      rel="stylesheet"
      href="/components/Header/Header.css"
    />

    <script src="/components/Aside/Aside.js"></script>
    <link
      rel="stylesheet"
      href="/components/Aside/Aside.css"
    />

    <script src="/components/ProductContainer/ProductContainer.js"></script>
    <link
      rel="stylesheet"
      href="/components/ProductContainer/ProductContainer.css"
    />
    <script src="/components/Card/Card.js"></script>
    <link
      rel="stylesheet"
      href="/components/Card/Card.css"
    />

    <script src="/components/Delivery/Delivery.js"></script>
    <link
      rel="stylesheet"
      href="/components/Delivery/Delivery.css"
    />

    <script src="/components/Payment/Payment.js"></script>
    <link
      rel="stylesheet"
      href="/components/Payment/Payment.css"
    />

    <script src="/components/Recipient/Recipient.js"></script>
    <link
      rel="stylesheet"
      href="/components/Recipient/Recipient.css"
    />
  </body>
</html>


<div class="cart-control">

  <div class="quantity-control">
    <button class="decrease-button" onclick="cart.decreaseQuantity()">-</button>
    <p class="product-quantity">${this.quantity}</p>
    <button class="increase-button" onclick="cart.increaseQuantity()">+</button>
    </div>
    <div class="product-exist-qty">${qtyText}</div>
    <button class="remove-button" onclick="cart.removeProduct()"><img src="/assets/img/delete.svg" alt="удалить" class="like-btn"></button>
    <button class="favorite-button" onclick="cart.toggleFavorite()"><img src="/assets/img/like.svg" alt="добавить в избранное" class="like-btn"></button></div>
  </div>
</div>
