<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>ТОВАРЫ И ТОЧКА</title>
    <link
      rel="icon"
      href="/assets/favicon/favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="/css/index.css"
    />
  </head>
  <body>
    <main class="wrapper">
      <div id="header"></div>
      <section class="main-section">
        <div class="container">
          <h2>Корзина</h2>
          <input
            type="checkbox"
            id="myCheckbox"
          />
          <label
            class="myCheckbox"
            for="myCheckbox"
            >Выбрать все</label
          >
          <div class="divider"></div>
          <div id="products-container">
            <div id="cards"></div>
            <div id="cardsSoldOut"></div>
          </div>
          <div id="delivery"></div>
          <div id="payment"></div>
          <div id="recipient"></div>
        </div>
        <div id="aside"></div>
      </section>
    </main>

    <!-- Модальное окно с адресами -->

    <div
      id="modalBackground"
      class="modal-background"
    ></div>
    <div
      id="addressModal"
      class="adress-modal"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h2>Способ доставки</h2>
          <button id="close-btn">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M0.929612 13.6568C0.539088 14.0473 0.539088 14.6805 0.929612 15.071C1.32014 15.4615 1.9533 15.4615 2.34383 15.071L8.00085 9.41399L13.658 15.0711C14.0485 15.4616 14.6817 15.4616 15.0722 15.0711C15.4627 14.6806 15.4627 14.0474 15.0722 13.6569L9.41506 7.99978L15.0717 2.34309C15.4623 1.95257 15.4623 1.3194 15.0717 0.928879C14.6812 0.538355 14.0481 0.538355 13.6575 0.928879L8.00085 6.58557L2.34427 0.928985C1.95374 0.538461 1.32058 0.538461 0.930055 0.928985C0.53953 1.31951 0.539531 1.95267 0.930055 2.3432L6.58663 7.99978L0.929612 13.6568Z"
                fill="#9797AF"
              />
            </svg>
          </button>
        </div>
        <div class="way-of-delivery">
          <button class="modal-btn-1">В пункт выдачи</button>
          <button class="modal-btn-2">Курьером</button>
        </div>

        <div class="my-adresses-modal">
          <h3>Мои адреса</h3>
          <ul id="addressList"></ul>
        </div>
        <button class="modal-confirm-btn">Выбрать</button>
      </div>
    </div>

    <footer>
      <img
        src="/assets/img/footer.svg"
        alt=""
      />
    </footer>
    <script
      type="module"
      src="/utils/formatNumbersWithDots.js"
    ></script>
    <script
      type="module"
      src="/constants/root.js"
    ></script>
    <script
      type="module"
      src="/utils/localStorageUtil.js"
    ></script>
    <script
      type="module"
      src="/constants/Catalog/catalog.js"
    ></script>
    <script
      type="module"
      src="/constants/Payment/CARDS.js"
    ></script>
    <script
      type="module"
      src="/constants/UserAdresses/UserAdresses.js"
    ></script>

    <script
      type="module"
      src="/components/Header/Header.js"
    ></script>
    <link
      rel="stylesheet"
      href="/components/Header/Header.css"
    />
    <script
      type="module"
      src="/components/Card/Card.js"
    ></script>
    <link
      rel="stylesheet"
      href="/components/Card/Card.css"
    />
    <script
      type="module"
      src="/components/Aside/Aside.js"
    ></script>
    <link
      rel="stylesheet"
      href="/components/Aside/Aside.css"
    />

    <script
      type="module"
      src="/components/ProductContainer/ProductContainer.js"
    ></script>
    <link
      rel="stylesheet"
      href="/components/ProductContainer/ProductContainer.css"
    />

    <script
      type="module"
      src="/components/Delivery/Delivery.js"
    ></script>
    <link
      rel="stylesheet"
      href="/components/Delivery/Delivery.css"
    />
    <script
      type="module"
      src="/components/EditAdressModal/EditAdressModal.js"
    ></script>
    <link
      rel="stylesheet"
      href="/components/EditAdressModal/EditAdressModal.css"
    />
  </body>
</html>
