<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>ТОВАРЫ И ТОЧКА</title>
    <link
      rel="icon"
      href="/assets/favicon/favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="/assets/normalize.css/normalize.css"
    />
    <link
      rel="stylesheet"
      href="/assets/fonts/fonts.css"
    />
    <link
      rel="stylesheet"
      href="/css/style.css"
    />
  </head>
  <body>
    <header>
      <button id="menu-button">
        <img
          src="/assets/img/menu_burger.svg"
          alt="menu"
        />
      </button>
      <h1>ТОВАРЫ И ТОЧКА</h1>
      <form id="search-form">
        <label for="search-input">
          <img
            src="search-icon.png"
            alt="Поиск"
          />
        </label>
        <input
          type="text"
          id="search-input"
          placeholder="Я ищу..."
        />
        <button type="submit">Искать</button>
        <button id="user-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          >
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
            ></path>
          </svg>
          Профиль
        </button>
        <button id="user-button">
          <div id="cart-indicator">0</div>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          >
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
            ></path>
          </svg>
          Корзина
        </button>
      </form>
    </header>
  </body>
</html>
